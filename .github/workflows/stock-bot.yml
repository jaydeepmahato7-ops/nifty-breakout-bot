name: run-indian-market

on:
  schedule:
    # आप अपने हिसाब से यहाँ टाइम सेट कर सकते हैं (जैसे सोमवार से शुक्रवार बाजार खुलने से पहले)
    - cron: '30 3 * * 1-5'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # (यहाँ से 'Run Stock Alerts' वाले स्टेप को पूरी तरह हटा दिया गया है)

      - name: Run Bot
        run: python main.py  # (या आपकी मुख्य बोट फाइल का जो नाम हो)

      - name: Run Supersonic Scanner
        run: python supersonic_scanner.py  # (जो भी आपकी स्क्रिप्ट का नाम हो)

      - name: Run NSE Announcement Bot
        run: python nse_announcement_bot.py

      - name: Upload Scan Report (Artifact)
        uses: actions/upload-artifact@v3
        with:
          name: market-reports
          path: |
            *.csv
            *.xlsx
