name: run-indian-market

on:
  schedule:
    - cron: '30 3 * * 1-5'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Bot
        run: python main.py

      - name: Run Supersonic Scanner
        run: python supersonic_scanner.py

      - name: Run NSE Announcement Bot
        run: python nse_announcement_bot.py

      - name: Upload Scan Report (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: market-reports
          path: |
            *.csv
            *.xlsx
