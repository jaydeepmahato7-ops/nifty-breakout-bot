name: Nifty 500 Breakout Bot

on:
  schedule:
    - cron: '*/5 3-10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Restore sent_alerts cache
        uses: actions/cache@v3
        with:
          path: sent_alerts.json
          key: sent-alerts-${{ github.run_id }}
          restore-keys: |
            sent-alerts-

      - name: Install Dependencies
        run: |
          pip install pandas yfinance requests beautifulsoup4

      - name: Run All Trading Bots
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python bot.py
          python scanner.py
          python "nse_Allrounder Supersonic Scanner_bot.py"
          python nse_announcement_bot.py
          python Stock_Alerts.py

      - name: Commit and Push trade_log.csv
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add trade_log.csv sent_alerts.json || true
          git commit -m "Auto-update trade log and cache [skip ci]" || echo "No changes to commit"
          git push
